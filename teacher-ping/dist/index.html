<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>老師，在嗎？</title>
<meta name="description" content="引路人・教師職場情境遊戲。下班了，手機還在響：選一個人，走完 6 回合，每則回覆只有 20 秒。顧對方、顧自己、守原則，每種回法都有代價。玩完看八面玲瓏範本。">
<meta property="og:title" content="老師，在嗎？｜引路人教師職場情境遊戲">
<meta property="og:description" content="下班了，手機還在響。6 回合、每則 20 秒，你會怎麼回？">
<meta name="theme-color" content="#2a1d16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap">
<style>
/* 版面：「檯燈下的晚上」。首頁＝奶茶米白底、琥珀檯燈光、焦糖棕文字；遊戲＝暗焦糖色房間裡一支被檯燈照亮的手機。
   按鈕一律膠囊形：主要＝琥珀實心＋柔和陰影，次要＝奶茶色外框；同一畫面只有一個主要按鈕。 */
:root{
  --cream:#f7eee2; --cream2:#f0e3d1; --paper:#fffaf3; --line:#e9d8c2; --tea:#d2b393; --tea-l:#e8d5bf;
  --ink:#4a3326; --ink2:#7a5d49; --ink3:#a88d77;
  --amber:#e9862c; --amber-d:#c96d18; --amber-l:#ffe6c8; --amber-ll:#fff3e3;
  --night:#2a1d16; --night2:#3b2a20;
  --do:#c8604f; --do-l:#f9e1db; --ds:#5f8a55; --ds-l:#e3eedb; --dp:#4f72a0; --dp-l:#e0e8f3;
  --chat:#ead8c0; --out:#ffcb8c;
  --display:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{text-wrap:balance;line-height:1.3}
p{text-wrap:pretty}
a{color:var(--amber-d)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
:focus-visible{outline:3px solid rgba(233,134,44,.55);outline-offset:3px;border-radius:12px}
.shell{max-width:1080px;margin:0 auto;padding-inline:16px}
@media(min-width:720px){.shell{padding-inline:28px}}
body.playing{overflow:hidden}
body.playing #site{display:none}

/* ===== 按鈕（膠囊） ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 26px;border-radius:999px;font-weight:700;font-size:16px;letter-spacing:.5px;text-align:center;line-height:1.3;transition:transform .16s var(--ease),box-shadow .2s,background .2s,border-color .2s;user-select:none}
.btn svg{width:19px;height:19px;flex:none;stroke:currentColor}
.btn:active{transform:scale(.95)}
.btn-pri{background:var(--amber);color:#fff;box-shadow:0 8px 18px -4px rgba(233,134,44,.55),inset 0 -3px 0 rgba(120,60,10,.14)}
.btn-pri:hover{background:#ee8f37;transform:translateY(-1px);box-shadow:0 12px 22px -4px rgba(233,134,44,.6),inset 0 -3px 0 rgba(120,60,10,.14)}
.btn-pri:active{transform:scale(.95)}
.btn-sec{background:var(--paper);color:var(--ink);border:2px solid var(--tea)}
.btn-sec:hover{background:var(--amber-ll);border-color:var(--amber)}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
.btn-text{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:6px 14px;border-radius:999px;font-weight:700;font-size:15px;color:var(--ink2)}
.btn-text:hover{color:var(--amber-d);background:rgba(233,134,44,.08)}
.btn-text svg{width:16px;height:16px;stroke:currentColor}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .btn{padding-inline:12px}
@media(max-width:420px){.row2 .btn{font-size:15px;letter-spacing:0}}
.btn.pop{animation:pop .4s var(--ease)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(.93)}70%{transform:scale(1.03)}100%{transform:scale(1)}}

/* ===== 頂欄（固定） ===== */
.topbar{position:sticky;top:0;z-index:30;background:rgba(247,238,226,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar .shell{display:flex;align-items:center;gap:12px;min-height:62px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:1px;color:var(--ink)}
.logo i{width:34px;height:34px;border-radius:12px;background:var(--amber);display:grid;place-items:center;flex:none;position:relative;box-shadow:0 4px 10px -2px rgba(233,134,44,.5)}
.logo i svg{width:18px;height:18px;stroke:#fff}
.logo i::after{content:"";position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--do);border:2px solid var(--cream)}

/* ===== Hero ===== */
.hero{position:relative;overflow:hidden;padding-block:clamp(28px,4.5vw,56px) clamp(32px,5vw,60px)}
.hero::before{content:"";position:absolute;left:-180px;top:-240px;width:760px;height:760px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,184,104,.55),rgba(255,184,104,0));pointer-events:none}
.hero-grid{position:relative;display:grid;gap:44px;align-items:center}
@media(min-width:900px){.hero-grid{grid-template-columns:1.05fr .95fr;gap:56px}}
.eyebrow{display:inline-block;font-size:13px;font-weight:700;letter-spacing:3px;color:var(--amber-d)}
.hero h1{font-family:var(--display);font-size:clamp(50px,7vw,80px);font-weight:700;letter-spacing:4px;line-height:1.1;margin:10px 0 14px;color:var(--ink);white-space:nowrap}
.hero h1 span{color:var(--amber)}
.hero .lead{font-size:clamp(18px,2.3vw,21px);font-weight:500;max-width:24em}
.hero .lead2{color:var(--ink2);margin-top:10px;max-width:29em}
.dirs{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.dchip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;border-radius:999px;padding:3px 12px;line-height:1.6}
.dchip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.dchip.o{background:var(--do-l);color:var(--do)}
.dchip.s{background:var(--ds-l);color:var(--ds)}
.dchip.p{background:var(--dp-l);color:var(--dp)}
.sound-hint{display:inline-flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--ink2);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 16px}
.sound-hint svg{width:19px;height:19px;stroke:var(--amber);flex:none}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}

/* 鎖定畫面（檯燈下的手機） */
.lock{justify-self:center;width:min(350px,100%);aspect-ratio:9/16;max-height:610px;border-radius:46px;padding:10px;background:#20160f;box-shadow:0 34px 70px -20px rgba(74,51,38,.55),0 0 0 1px rgba(0,0,0,.05)}
.lock-in{position:relative;height:100%;border-radius:38px;overflow:hidden;background:radial-gradient(110% 65% at 25% 0%,#f3a457 0%,#8c4f2a 38%,#3a2418 72%,#24170f 100%);padding:46px 14px 18px;display:flex;flex-direction:column}
.lock-time{text-align:center;font-family:var(--mono);font-weight:500;font-size:58px;letter-spacing:2px;color:#fff8ef;line-height:1}
.lock-date{text-align:center;color:rgba(255,248,239,.8);font-size:14px;margin-top:6px}
.notes{margin-top:auto;display:grid;gap:8px}
.note{display:flex;gap:10px;align-items:flex-start;background:rgba(255,246,234,.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:20px;padding:10px 12px;animation:noteIn .6s var(--ease) both}
.note:nth-child(2){animation-delay:.9s}.note:nth-child(3){animation-delay:1.8s}.note:nth-child(4){animation-delay:2.7s}
@keyframes noteIn{from{opacity:0;transform:translateY(-14px) scale(.98)}to{opacity:1;transform:none}}
.note .av{width:34px;height:34px;border-radius:12px;background:rgba(255,246,234,.25);display:grid;place-items:center;font-size:19px;flex:none;line-height:1}
.note .tx{min-width:0;flex:1}
.note .row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:rgba(255,248,239,.75)}
.note .row b{color:#fff;font-size:13.5px}
.note p{font-size:13.5px;color:#fff;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note.miss p{color:#ffd0c4}

/* ===== 區塊 ===== */
.sec{padding-block:clamp(40px,6vw,72px)}
.sec-head{max-width:640px;margin-bottom:26px}
.sec-head h2{font-family:var(--display);font-size:clamp(30px,4.4vw,42px);margin-top:6px}
.sec-head p{color:var(--ink2);margin-top:8px}
.cards{display:grid;gap:16px}
@media(min-width:900px){.cards{grid-template-columns:repeat(3,1fr)}}
.who{position:relative;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:22px 20px 18px;box-shadow:0 14px 30px -22px rgba(74,51,38,.5);transition:transform .25s var(--ease),box-shadow .25s}
.who:not(.wip):hover{transform:translateY(-3px);box-shadow:0 20px 36px -22px rgba(74,51,38,.55)}
.who .top{display:flex;align-items:center;gap:12px}
.who .av{width:50px;height:50px;border-radius:18px;background:var(--amber-l);display:grid;place-items:center;font-size:27px;line-height:1;flex:none}
.who .role{font-size:13px;font-weight:700;color:var(--amber-d);letter-spacing:1px}
.who .nm{display:block;font-weight:700;font-size:17px;line-height:1.35}
.who .time{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink3)}
.who h3{font-family:var(--display);font-size:25px;margin:16px 0 10px}
.who .bubble{align-self:flex-start;max-width:100%;background:var(--chat);border-radius:18px 18px 18px 6px;padding:8px 14px;font-size:14.5px;line-height:1.55}
.who .teaser{color:var(--ink2);font-size:15px;margin-top:12px;flex:1}
.who .acts{display:grid;gap:6px;margin-top:18px}
.who .acts .btn{width:100%}
.who .acts .btn-text{justify-self:center}
.who.wip{background:rgba(255,250,243,.6)}
.who.wip .av,.who.wip h3,.who.wip .bubble{opacity:.6}
.who .wip-tag{position:absolute;top:18px;right:18px;font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--cream2);border-radius:999px;padding:2px 12px}
.who.wip .time{display:none}
.how{margin-top:20px;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:16px 18px 14px;max-width:34em}
.how-t{font-size:13px;font-weight:700;letter-spacing:2px;color:var(--amber-d)}
.steps{list-style:none;counter-reset:st;display:grid;gap:12px;margin-top:8px}
.steps li{position:relative;padding-left:44px}
.steps li::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:1px;width:30px;height:30px;border-radius:50%;background:var(--amber-l);color:var(--amber-d);display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:14px}
.steps b{font-size:16px}
.steps p{color:var(--ink2);font-size:14.5px;line-height:1.65}
.steps .dirs{margin-top:6px}
.btn.big{min-height:60px;font-size:18.5px;padding:14px 34px}
.btn.big svg{width:21px;height:21px}
@media(max-width:600px){.hero-cta .btn.big{width:100%}.hero h1{font-size:clamp(40px,12vw,54px);letter-spacing:2px}}
.pick{padding-top:clamp(20px,4vw,40px)}
.back-link{margin-left:-14px;margin-bottom:6px}
.foot{border-top:1px solid var(--line);padding-block:26px calc(26px + env(safe-area-inset-bottom,0px));font-size:14px;color:var(--ink2)}
.foot .shell{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between}
.foot a{color:var(--ink);font-weight:700;text-decoration:none}
.foot a:hover{color:var(--amber-d)}

/* ===== 遊戲舞台 ===== */
#stage:empty{display:none}
#stage{position:fixed;inset:0;z-index:40;background:radial-gradient(70% 55% at 50% -5%,rgba(255,168,84,.38),rgba(255,168,84,0) 70%),linear-gradient(180deg,#3a281d,#21160f);display:flex;flex-direction:column;align-items:center;overflow:hidden}

/* 背景卡 */
.bgcard{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;overflow-y:auto;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.bg-in{flex:none;margin:auto;width:min(460px,100%);background:var(--paper);border-radius:32px;padding:30px 26px 26px;box-shadow:0 40px 80px -30px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.04);position:relative;overflow:hidden}
.bg-in::before{content:"";position:absolute;left:50%;top:-140px;width:360px;height:260px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,184,104,.5),rgba(255,184,104,0));pointer-events:none}
.bg-in .when{position:relative;display:inline-block;font-size:13px;font-weight:700;letter-spacing:2px;color:var(--amber-d);background:var(--amber-l);border-radius:999px;padding:3px 12px;margin-bottom:16px}
.bg-in p{position:relative;font-family:var(--display);font-size:clamp(19px,2.6vw,22px);line-height:1.75;opacity:0;animation:fadeUp .7s var(--ease) both}
.bg-in .gap{display:block;height:16px}
.bg-in p.last{font-weight:700;color:var(--amber-d);margin-top:6px}
.bg-in .rule{position:relative;display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:20px;padding-top:16px;border-top:1px dashed var(--line);font-size:14px;color:var(--ink2);opacity:0;animation:fadeUp .6s var(--ease) both}
.bg-in .rule span{display:inline-flex;align-items:center;gap:6px}
.bg-in .rule svg{width:16px;height:16px;stroke:var(--amber)}
.bg-in .go{position:relative;width:100%;margin-top:18px;opacity:0;animation:fadeUp .6s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* HUD：離開／回合／聲音 */
.hud{width:min(460px,100%);flex:none;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;color:#fff3e3}
.hbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;background:rgba(255,243,227,.12);border:1px solid rgba(255,243,227,.18);font-size:14px;font-weight:700;color:#fff3e3;transition:background .2s}
.hbtn:hover{background:rgba(255,243,227,.2)}
.hbtn svg{width:17px;height:17px;stroke:currentColor}
.hbtn.icon{width:38px;padding:0;justify-content:center}
.rounds{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.rdots{display:flex;gap:6px}
.rdots i{width:9px;height:9px;border-radius:50%;background:rgba(255,243,227,.22);transition:background .3s,transform .3s}
.rdots i.done{background:var(--amber)}
.rdots i.cur{background:#fff3e3;transform:scale(1.25);box-shadow:0 0 0 3px rgba(233,134,44,.5)}
.rtxt{font-size:13px;font-weight:700;letter-spacing:1px;color:rgba(255,243,227,.85)}

/* 手機 */
.phone{--ph:calc(100dvh - 92px);height:min(var(--ph),920px);width:min(calc(min(var(--ph),920px) * .49),460px);flex:none;border-radius:48px;padding:10px;background:#160f0a;box-shadow:0 40px 90px -30px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06),0 0 120px -40px rgba(255,170,80,.45)}
.phone.buzz{animation:buzz .32s linear}
@keyframes buzz{0%,100%{transform:none}20%{transform:translateX(-3px) rotate(-.4deg)}40%{transform:translateX(3px) rotate(.4deg)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.screen{position:relative;height:100%;border-radius:39px;overflow:hidden;background:var(--chat);display:flex;flex-direction:column}
.sbar{flex:none;background:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:10px 24px 4px;font-family:var(--mono);font-size:13px;font-weight:500;color:var(--ink)}
.sbar .ic{display:flex;gap:5px}
.sbar svg{width:15px;height:15px;stroke:var(--ink)}
.chead{flex:none;display:flex;align-items:center;gap:10px;padding:6px 12px 10px;background:var(--paper);border-bottom:1px solid var(--line)}
.back{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;transition:background .2s}
.back:hover{background:rgba(74,51,38,.06)}
.back svg{width:24px;height:24px;stroke:var(--ink)}
.back .bdot{position:absolute;top:3px;right:1px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:#e5483b;color:#fff;font-size:11.5px;font-weight:700;line-height:19px;text-align:center;border:2px solid var(--paper)}
.back .bdot[hidden]{display:none}
.chead .av{width:38px;height:38px;border-radius:50%;background:var(--amber-l);display:grid;place-items:center;font-size:21px;line-height:1;flex:none}
.chead .nm{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.chead .nm b{font-size:16px}
.chead .nm small{font-size:12px;color:var(--ink3)}
.feeds{position:relative;flex:1;min-height:0}
.feed{position:absolute;inset:0;overflow-y:auto;padding:14px 12px 18px;scroll-behavior:smooth;overscroll-behavior:contain}
.feed[hidden]{display:none}

/* 訊息 */
.m{display:flex;align-items:flex-end;gap:8px;margin-top:10px;animation:msgIn .28s var(--ease) both}
.m.cont{margin-top:4px}
.m.cont .mav{visibility:hidden}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mav{width:32px;height:32px;border-radius:50%;background:var(--amber-l);display:grid;place-items:center;font-size:18px;line-height:1;flex:none}
.mb{display:flex;flex-direction:column;min-width:0;max-width:78%}
.mb .row{display:flex;align-items:flex-end;gap:6px}
.snd{font-size:12px;font-weight:700;color:var(--ink2);margin:0 0 3px 4px}
.b{background:#fff;border-radius:20px 20px 20px 6px;padding:9px 14px;font-size:15.5px;line-height:1.6;box-shadow:0 1px 2px rgba(74,51,38,.08);word-break:break-word}
.m.cont .b{border-radius:20px}
.tm{font-size:11px;color:var(--ink3);font-family:var(--mono);flex:none;padding-bottom:2px}
.m.out{justify-content:flex-end}
.m.out .mb{align-items:flex-end}
.m.out .row{flex-direction:row-reverse}
.m.out .b{background:var(--out);border-radius:20px 20px 6px 20px}
.read{font-size:11px;color:var(--ink3);margin-top:2px}
.read[hidden]{display:none}
.b.unsent{background:transparent;box-shadow:none;border:1px dashed var(--tea);color:var(--ink3);font-size:13.5px}
.typing{display:flex;gap:4px;background:#fff;border-radius:20px 20px 20px 6px;padding:13px 15px;box-shadow:0 1px 2px rgba(74,51,38,.08)}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink3);animation:dot 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes dot{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.sys,.div{display:block;width:fit-content;margin:14px auto 4px;font-size:12px;color:var(--ink2);background:rgba(74,51,38,.1);border-radius:999px;padding:3px 12px;text-align:center}
.act{margin:12px auto 4px;max-width:86%;text-align:center;font-size:13.5px;color:var(--ink2);font-style:italic}
.call-log{display:flex;align-items:center;gap:8px;width:fit-content;margin:14px auto 4px;font-size:13px;color:var(--ink);background:#fff;border-radius:999px;padding:5px 14px;box-shadow:0 1px 2px rgba(74,51,38,.08)}
.call-log svg{width:16px;height:16px;stroke:var(--ds)}
.call-log.miss{color:#c2412f}
.call-log.miss svg{stroke:#c2412f}
.voice{display:flex;align-items:center;gap:10px;min-width:170px}
.voice .play{width:34px;height:34px;border-radius:50%;background:var(--amber);display:grid;place-items:center;flex:none;box-shadow:0 3px 8px -2px rgba(233,134,44,.6)}
.voice .play svg{width:15px;height:15px;fill:#fff;margin-left:2px}
.voice .wave{display:flex;align-items:center;gap:2px;height:24px;flex:1}
.voice .wave i{width:3px;border-radius:2px;background:var(--tea)}
.voice.playing .wave i{background:var(--amber);animation:wv .9s infinite ease-in-out}
.voice.playing .wave i:nth-child(3n){animation-delay:.2s}.voice.playing .wave i:nth-child(3n+1){animation-delay:.4s}
@keyframes wv{50%{transform:scaleY(.4)}}
.voice .d{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.vhint{font-size:11.5px;color:var(--amber-d);margin-top:4px;font-weight:700}
.vtext{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:14px;color:var(--ink2);line-height:1.6}
.vtext[hidden]{display:none}

/* 通知橫幅（另一個視窗）：深焦糖底＋琥珀，跟聊天區明顯區隔 */
.banner{position:absolute;left:10px;right:10px;top:8px;z-index:15;display:flex;align-items:center;gap:10px;text-align:left;background:#3b2a20;border:1px solid rgba(255,190,120,.35);color:#fff3e3;border-radius:22px;padding:10px 12px;box-shadow:0 16px 30px -10px rgba(33,22,15,.6);animation:bnIn .35s var(--ease) both;cursor:pointer}
.banner .av{width:36px;height:36px;border-radius:12px;background:rgba(255,243,227,.14);display:grid;place-items:center;font-size:20px;line-height:1;flex:none}
.banner .tx{flex:1;min-width:0;line-height:1.4}
.banner .tx b{display:block;font-size:14px;color:#ffcf94}
.banner .tx span{display:block;font-size:13.5px;color:rgba(255,243,227,.88);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner .open{flex:none;font-size:12.5px;font-weight:700;color:#fff;background:var(--amber);border-radius:999px;padding:4px 12px}
.banner.sticky{animation:bnIn .35s var(--ease) both,glow 1.6s ease-in-out infinite .4s}
@keyframes bnIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(233,134,44,.0),0 16px 30px -10px rgba(33,22,15,.6)}50%{box-shadow:0 0 0 5px rgba(233,134,44,.45),0 16px 30px -10px rgba(33,22,15,.6)}}

/* 對話列表 */
.clist{position:absolute;left:0;right:0;bottom:0;top:0;z-index:17;background:var(--chat);display:flex;flex-direction:column;animation:fadeIn .2s both}
.clist[hidden]{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.clist .ch{display:flex;align-items:center;gap:8px;padding:44px 16px 12px;border-bottom:1px solid var(--line)}
.clist .ch b{font-size:20px;font-family:var(--display)}
.clist .ch .x{margin-left:auto}
.crow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);transition:background .2s}
.crow:hover{background:rgba(74,51,38,.04)}
.crow .av{width:46px;height:46px;border-radius:50%;background:var(--amber-l);display:grid;place-items:center;font-size:24px;line-height:1;flex:none}
.crow .tx{flex:1;min-width:0;line-height:1.45}
.crow .tx b{display:block;font-size:15.5px}
.crow .tx span{display:block;font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.crow .rt i{font-style:normal;min-width:20px;height:20px;border-radius:999px;background:#e5483b;color:#fff;font-family:var(--sans);font-size:11.5px;font-weight:700;line-height:20px;text-align:center;padding:0 6px}

/* 輸入區 */
.comp{flex:none;background:var(--paper);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:9px}
.tmr{display:flex;align-items:center;gap:10px}
.tmr[hidden]{display:none}
.tmr .lb{font-size:12px;font-weight:700;color:var(--ink2);flex:none}
.tb{flex:1;height:10px;border-radius:999px;background:var(--cream2);overflow:hidden}
.tb i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#f0a24f,var(--amber));transform-origin:left;transition:transform .1s linear}
.tmr b{font-family:var(--mono);font-weight:500;font-size:15px;min-width:24px;text-align:right;color:var(--ink)}
.tmr.hot .tb i{background:linear-gradient(90deg,#e6735e,var(--do))}
.tmr.hot b{color:var(--do)}
.opts{display:flex;flex-direction:column;gap:8px;max-height:min(48vh,380px);overflow-y:auto;padding:2px}
.opts[hidden]{display:none}
.opt{text-align:left;background:#fff;border:2px solid var(--tea-l);border-radius:22px;padding:12px 16px;font-size:15.5px;line-height:1.6;color:var(--ink);box-shadow:0 3px 0 var(--line);transition:transform .14s var(--ease),border-color .2s,box-shadow .14s;animation:optIn .3s var(--ease) both}
.opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}
.opt:hover{border-color:var(--amber)}
.opt:active{transform:translateY(2px) scale(.985);box-shadow:0 1px 0 var(--line)}
@keyframes optIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.waitbar{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#3b2a20;border:2px solid var(--amber);border-radius:22px;padding:11px 12px 11px 14px;font-size:15px;color:#fff3e3;animation:glow 1.6s ease-in-out infinite}
.waitbar .av{font-size:22px;line-height:1}
.waitbar .wt{flex:1;min-width:0}
.waitbar b{color:#ffcf94}
.waitbar .open{flex:none;font-size:13px;font-weight:700;color:#fff;background:var(--amber);border-radius:999px;padding:4px 12px}
.inbar{display:flex;align-items:center;gap:8px}
.inbox{flex:1;min-height:42px;max-height:96px;overflow:hidden;border-radius:21px;background:var(--cream);padding:9px 16px;font-size:15px;line-height:1.55;color:var(--ink)}
.inbox .ph{color:var(--ink3)}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--amber);vertical-align:-2px;margin-left:1px;animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.send{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--cream2);flex:none;transition:background .2s}
.send svg{width:20px;height:20px;stroke:var(--ink3)}
.send.on{background:var(--amber)}
.send.on svg{stroke:#fff}

/* 來電 */
.callov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;padding:56px 18px calc(22px + env(safe-area-inset-bottom,0px));color:#fff3e3;background:radial-gradient(90% 50% at 50% 0%,rgba(255,170,80,.35),rgba(255,170,80,0)),linear-gradient(180deg,#4a3223,#1f150e);animation:fadeIn .3s both;overflow-y:auto}
.callov.bye{animation:fadeOut .45s both}
@keyframes fadeOut{to{opacity:0}}
.cst{font-size:14px;color:rgba(255,243,227,.75);letter-spacing:1px}
.cst b{font-family:var(--mono);font-weight:500;color:#fff3e3}
.cav{width:96px;height:96px;border-radius:50%;background:rgba(255,243,227,.14);display:grid;place-items:center;font-size:52px;line-height:1;margin-top:18px;flex:none}
.callov.ringing .cav{animation:ring 1.2s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,184,104,.55)}100%{box-shadow:0 0 0 26px rgba(255,184,104,0)}}
.cnm{font-family:var(--display);font-size:27px;font-weight:700;margin-top:12px}
.csub{font-size:13px;color:rgba(255,243,227,.6)}
.hint{display:inline-flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:#ffd9ad;background:rgba(255,243,227,.1);border-radius:999px;padding:4px 12px}
.hint svg{width:16px;height:16px;stroke:currentColor}
.ringleft{margin-top:8px;font-family:var(--mono);font-size:13px;color:rgba(255,243,227,.6)}
.cap{width:100%;margin-top:18px;display:flex;flex-direction:column;gap:8px}
.cap p{font-size:16.5px;line-height:1.65;text-align:center;animation:fadeUp .35s both}
.cap p.old{opacity:.42;font-size:14.5px}
.cap p.me{color:#ffd9ad}
.cbox{width:100%;margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:8px}
.cbox .tmr .tb{background:rgba(255,243,227,.15)}
.cbox .tmr b{color:#fff3e3}
.cbox .tmr .lb{color:rgba(255,243,227,.75)}
.copt{text-align:left;background:rgba(255,243,227,.12);border:2px solid rgba(255,243,227,.22);border-radius:22px;padding:11px 15px;font-size:15px;line-height:1.55;color:#fff3e3;transition:background .2s,transform .14s;animation:optIn .3s var(--ease) both}
.copt:hover{background:rgba(255,243,227,.2);border-color:#ffb46a}
.copt:active{transform:scale(.985)}
.cbtns{display:flex;justify-content:space-around;width:100%;margin-top:auto;padding-top:18px}
.cbtns:empty{display:none}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13.5px;color:#fff3e3}
.cbtn i{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;transition:transform .15s}
.cbtn:active i{transform:scale(.92)}
.cbtn i svg{width:30px;height:30px;stroke:#fff}
.cbtn.no i{background:#d4483a}
.cbtn.no i svg{transform:rotate(135deg)}
.cbtn.yes i{background:#4f9b5b;animation:bounce 1.2s infinite}
@keyframes bounce{0%,100%{transform:none}50%{transform:translateY(-5px)}}

/* 對話框 */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(33,22,15,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fadeIn .2s both}
.modal .box{width:min(400px,100%);background:var(--paper);border-radius:28px;padding:26px 22px 20px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);animation:popIn .3s var(--ease) both}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.modal h3{font-family:var(--display);font-size:24px}
.modal p{color:var(--ink2);margin:8px 0 20px;font-size:15px}
.modal .row2 .btn,.modal .one{width:100%}

/* 結局卡 */
.endov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(33,22,15,.6);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fadeIn .4s both;overflow-y:auto}
.endcard{width:min(460px,100%);background:var(--paper);border-radius:32px;padding:28px 22px 18px;box-shadow:0 40px 80px -30px rgba(0,0,0,.7);position:relative;overflow:hidden;animation:popIn .45s var(--ease) both}
.endcard::before{content:"";position:absolute;left:50%;top:-150px;width:380px;height:280px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,184,104,.5),rgba(255,184,104,0));pointer-events:none}
.ek{position:relative;display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:2px;color:var(--amber-d);background:var(--amber-l);border-radius:999px;padding:3px 12px}
.ek.hid{color:#fff;background:linear-gradient(90deg,var(--do),var(--amber),var(--ds),var(--dp))}
.endcard h2{position:relative;font-family:var(--display);font-size:clamp(30px,6vw,36px);margin:12px 0 10px}
.endcard .epi{position:relative;font-size:15.5px;line-height:1.85;color:var(--ink)}
.tend{position:relative;margin-top:18px;background:var(--cream);border-radius:20px;padding:14px 16px}
.tend h4{font-size:13px;color:var(--ink2);margin-bottom:8px;font-weight:700;letter-spacing:1px}
.trow{display:grid;grid-template-columns:4em 1fr 1.6em;align-items:center;gap:10px;font-size:14px;font-weight:700;margin-top:6px}
.trow .bar{height:10px;border-radius:999px;background:rgba(74,51,38,.08);overflow:hidden}
.trow .bar i{display:block;height:100%;border-radius:999px;transform-origin:left;animation:grow .9s var(--ease) both .3s}
@keyframes grow{from{transform:scaleX(0)}}
.trow.o{color:var(--do)}.trow.o .bar i{background:var(--do)}
.trow.s{color:var(--ds)}.trow.s .bar i{background:var(--ds)}
.trow.p{color:var(--dp)}.trow.p .bar i{background:var(--dp)}
.trow em{font-style:normal;font-family:var(--mono);text-align:right;color:var(--ink)}
.end-acts{position:relative;display:flex;flex-direction:column;gap:10px;margin-top:20px}
.end-acts .btn{width:100%}
.end-acts .btn-text{align-self:center}
@media(max-width:600px){
  .end-acts .btn-pri{order:2}
  .end-acts .row2{order:1}
  .end-acts .btn-text{order:3}
}

/* 圖卡 */
.cardov{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:rgba(33,22,15,.88);animation:fadeIn .25s both}
.cardov img{max-height:68vh;max-width:100%;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.cardov p{color:#fff3e3;font-size:14px;text-align:center}
.cardov .row2{width:min(380px,100%)}
.cardov .btn{width:100%}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:100;background:var(--night);color:#fff3e3;border-radius:999px;padding:9px 18px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== 八面玲瓏範本頁（一回合一頁） ===== */
.tpl-wrap{max-width:820px}
.tpl-top{position:sticky;top:calc(62px + env(safe-area-inset-top,0px));z-index:20;background:rgba(247,238,226,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:8px 0 12px}
.tpl-ttl{display:flex;align-items:center;flex-wrap:wrap;gap:2px 12px}
.tpl-ttl .back-link{margin-bottom:0}
.tpl-ttl .eyebrow{font-size:12px;letter-spacing:2px}
.tpl-ttl h1{font-family:var(--display);font-size:clamp(22px,4vw,30px);line-height:1.2}
.tsteps{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding:2px}
.ts{flex:none;min-width:36px;height:36px;padding:0 6px;border-radius:999px;border:2px solid var(--tea-l);background:var(--paper);font-family:var(--mono);font-size:14px;font-weight:500;color:var(--ink2);transition:background .2s,border-color .2s,transform .15s}
.ts:active{transform:scale(.92)}
.ts.wide{padding:0 13px;font-family:var(--sans);font-size:13px;font-weight:700}
.ts.d-o{border-color:var(--do)}.ts.d-s{border-color:var(--ds)}.ts.d-p{border-color:var(--dp)}
.ts.on{background:var(--amber);border-color:var(--amber);color:#fff}
.tpl-body{padding:18px 0 44px}
.remind{display:flex;gap:14px;align-items:flex-start;border-radius:26px;padding:20px 20px}
.remind .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;font-size:23px;line-height:1}
.remind b{display:block;font-size:18px;margin-bottom:4px;font-family:var(--display)}
.remind p{font-size:15.5px;line-height:1.8}
.remind.strong{background:#4a3326;color:#fff3e3;box-shadow:0 18px 36px -24px rgba(33,22,15,.8)}
.remind.strong .ic{background:rgba(255,243,227,.13)}
.remind.strong b{color:#ffcf94}
.remind.strong p{color:rgba(255,243,227,.93)}
.mine{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:16px 18px}
.mine .t{font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:1px}
.mine h3{font-family:var(--display);font-size:24px;margin:2px 0 8px}
.mine .dirs{margin-top:0}
.mine .note2{color:var(--ink2);font-size:14.5px;margin-top:8px}
.howread{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:16px 18px;font-size:15px}
.howread ol{padding-left:1.4em;color:var(--ink2);margin-top:4px}
.tnav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.tnav.one{grid-template-columns:1fr}
.tnav .btn{width:100%}
.tnav-more{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:8px}
.tr{background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:20px 18px 18px;box-shadow:0 14px 30px -26px rgba(74,51,38,.5)}
@media(min-width:720px){.tr{padding:24px 26px 22px}}
.tr-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding-bottom:12px;border-bottom:1px dashed var(--line);margin-bottom:6px}
.tr-head .rn{font-size:13px;font-weight:700;color:#fff;background:var(--amber);border-radius:999px;padding:2px 12px;letter-spacing:1px}
.tr-head .rt{font-family:var(--mono);font-size:13px;color:var(--ink3)}
.tr-head .rw{font-weight:700}
.tr-head .tag{font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--cream2);border-radius:999px;padding:1px 10px}
.tchat{background:var(--chat);border-radius:22px;padding:6px 12px 14px;margin-top:12px}
.tchat .mb{max-width:86%}
.tcall{margin:12px 0 2px;border-radius:18px;background:linear-gradient(180deg,#4a3223,#2b1d14);color:#fff3e3;padding:12px 14px}
.tcall .h{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:#ffd9ad}
.tcall .h svg{width:16px;height:16px;stroke:currentColor}
.tcall p{font-size:14.5px;line-height:1.7;margin-top:6px}
.lbl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:1px;color:var(--ink2);margin:18px 0 8px}
.lbl::after{content:"";flex:1;height:1px;background:var(--line)}
.thk{position:relative;font-family:var(--display);font-size:17px;line-height:1.75;border-radius:24px;padding:14px 18px}
.thk small{display:block;font-family:var(--sans);font-size:12.5px;font-weight:700;letter-spacing:1px;margin-bottom:2px}
.thk.them{background:#fff;border:2px dashed var(--tea);margin-right:10%}
.thk.them small{color:var(--amber-d)}
.thk.me{background:var(--do-l);margin-left:10%;margin-top:10px}
.thk.me small{color:var(--do)}
.cmp{display:grid;gap:12px}
.cmp.two{grid-template-columns:1fr}
@media(min-width:720px){.cmp.two{grid-template-columns:1fr 1.25fr}}
.say{border-radius:24px;padding:14px 16px}
.say small{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:1px;margin-bottom:6px}
.say p{font-size:15.5px;line-height:1.75}
.say.yours{background:var(--cream);border:1px solid var(--line)}
.say.yours small{color:var(--ink2)}
.say.best{background:var(--out);box-shadow:inset 0 0 0 2px rgba(233,134,44,.35)}
.say.best small{color:var(--amber-d)}
.say .dchip{font-size:12px;padding:1px 9px;letter-spacing:0}
.why{display:grid;gap:8px;margin-top:12px}
.why div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:15px;line-height:1.65}
.why .dchip{margin-top:1px}
/* ===== 手機：滿版 ===== */
@media(max-width:600px){
  .hud{width:100%;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px}
  .hbtn .t{display:none}
  .hbtn{width:38px;padding:0;justify-content:center}
  .phone{width:100%;flex:1;height:auto;border-radius:0;padding:0;background:none;box-shadow:none}
  .screen{border-radius:22px 22px 0 0}
  .sbar{display:none}
  .clist .ch{padding-top:14px}
  .callov{padding-top:34px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media(max-width:600px){.ts{min-width:32px;height:32px;padding:0 4px;font-size:13px}.ts.wide{padding:0 9px;font-size:12.5px}.tsteps{gap:4px}}

function addMin(t, m){ if (!m || !/^\d\d:\d\d$/.test(t)) return t; var p = t.split(':'), v = (+p[0] * 60 + +p[1] + m) % 1440; return ('0' + Math.floor(v / 60)).slice(-2) + ':' + ('0' + v % 60).slice(-2); }
function splitSentences(s){
  var out = [], buf = '';
  for (var i = 0; i < s.length; i++){ buf += s[i]; if ('，。？！…'.indexOf(s[i]) >= 0 && buf.length > 6){ out.push(buf); buf = ''; } }
  if (buf.trim()) out.push(buf);
  return out;
}
/* 中文斷句：把文字按標點切成一句一句，換行只發生在句與句之間，避免單字落單或從句子中間斷開 */
var PUNCT = '，。、？！；：…～」』）)》,.!?';
function ph(text){
  var s = String(text), out = [], buf = '';
  for (var i = 0; i < s.length; i++){
    buf += s[i];
    if (PUNCT.indexOf(s[i]) >= 0 && PUNCT.indexOf(s[i + 1] || '') < 0){ out.push(buf); buf = ''; }
  }
  if (buf) out.push(buf);
  if (out.length > 1 && out[out.length - 1].length <= 2){ var tail = out.pop(); out[out.length - 1] += tail; }
  return out.map(function(c){ return c.length > 16 ? pp(c) : '<span class="ph">' + esc(c) + '</span>'; }).join('');
}
/* 長段落：正常排滿，只把最後一小段黏在一起，避免最後一行只剩一兩個字 */
function pp(text){
  var t = String(text), P = '，。、？！；：';
  /* 找最後一個句中標點，最後一句 10 字內就整句黏住；太長就只黏最後 3 個字 */
  var end = t.length; while (end > 0 && PUNCT.indexOf(t[end - 1]) >= 0) end--;
  var i = end - 1; while (i >= 0 && P.indexOf(t[i]) < 0) i--;
  var cut = (t.length - (i + 1) <= 11 && i > 0) ? i + 1 : Math.max(0, end - 3);
  return esc(t.slice(0, cut)) + '<span class="nw">' + esc(t.slice(cut)) + '</span>';
}

/* ---------------- 音效與語音 ---------------- */
function audioUnlock(){
  try {
    if (!AUDIO.ctx){ var C = window.AudioContext || window.webkitAudioContext; if (C) AUDIO.ctx = new C(); }
    if (AUDIO.ctx && AUDIO.ctx.state === 'suspended') AUDIO.ctx.resume();
  } catch(e){}
  try { if (window.speechSynthesis){ speechSynthesis.getVoices(); var u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } } catch(e){}
}
function beep(f, d, t0, g, type){
  var c = AUDIO.ctx; if (!c || !AUDIO.on) return;
  try {
    var o = c.createOscillator(), v = c.createGain(), t = c.currentTime + (t0 || 0), gg = g || 0.08;
    o.type = type || 'sine'; o.frequency.value = f;
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(gg, t + 0.015); v.gain.setValueAtTime(gg, t + Math.max(0.02, d - 0.03)); v.gain.linearRampToValueAtTime(0, t + d);
    o.connect(v); v.connect(c.destination); o.start(t); o.stop(t + d + 0.03);
  } catch(e){}
}
function sndKey(){ beep(988, 0.07, 0, 0.05); beep(1318, 0.09, 0.08, 0.05); }
function sndSend(){ beep(520, 0.06, 0, 0.04); beep(880, 0.08, 0.05, 0.04); }
function sndRing(){ for (var i = 0; i < 10; i++) beep(i % 2 ? 640 : 860, 0.07, i * 0.08, 0.08); }
function sndHang(){ for (var i = 0; i < 3; i++) beep(480, 0.2, i * 0.36, 0.07); }
function vibrate(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch(e){} }
function buzz(){ var p = $('phone'); if (!p) return; p.classList.remove('buzz'); void p.offsetWidth; p.classList.add('buzz'); }
function zhVoices(){ try { return speechSynthesis.getVoices().filter(function(v){ return /^(zh|cmn)/i.test(v.lang) || /Chinese|中文|國語|普通話/.test(v.name); }); } catch(e){ return []; } }
function isNatural(v){ return !!v && /Natural|Neural|Online|Premium|Enhanced|加強|優化/i.test(v.name); }
function isMale(v){ return !!v && /YunJhe|雲哲|Zhiwei|志偉|Male|男/i.test(v.name); }
function scoreVoice(v, g){
  var n = v.name + ' ' + v.lang, s = 0;
  if (/TW|Taiwan|臺灣|台灣/i.test(n)) s += 50; else if (/HK|Hong|粵|yue/i.test(n)) s -= 40;
  if (isNatural(v)) s += 30;
  if (/Google/i.test(n)) s += 8;
  if (/美佳|Meijia|HsiaoChen|HsiaoYu|曉臻|曉雨|Yating|雅婷|Female|女/i.test(n)) s += g === 'm' ? -12 : 12;
  if (isMale(v)) s += g === 'm' ? 25 : -20;
  return s;
}
function pickVoice(g){
  var vs = zhVoices(); if (!vs.length) return null;
  vs.sort(function(a, b){ return scoreVoice(b, g) - scoreVoice(a, g); });
  return vs[0];
}
/* 逐句朗讀＋字幕；沒有語音或語音失敗時，自動改成字幕節奏 */
function speakLines(lines, opt, onLine, onDone){
  var i = 0, stopped = false, wd = null;
  var useVoice = AUDIO.on && ('speechSynthesis' in window);
  var voice = useVoice ? pickVoice(opt.g) : null;
  try { if (useVoice) speechSynthesis.cancel(); } catch(e){}
  function textTime(s){ return s.length * 190 + 700; }
  function next(){
    clearTimeout(wd); if (stopped) return;
    if (i >= lines.length){ stopped = true; onDone(); return; }
    var line = lines[i++]; onLine(line, i - 1);
    if (!useVoice || /^（.*）/.test(line) && line.length < 9){ wd = setTimeout(next, textTime(line)); return; }
    try {
      var u = new SpeechSynthesisUtterance(line.replace(/（[^）]*）/g, '').replace(/[()]/g, '')), started = false, fin = false, t0 = Date.now();
      u.lang = (voice && voice.lang) || 'zh-TW'; if (voice) u.voice = voice;
      /* 自然語音本來就比較有語氣，速度放慢、音高不要亂調；男性角色找不到男聲時才壓低音高 */
      var nat = isNatural(voice);
      u.rate = nat ? Math.min(1.25, (opt.rate || 1.3) - 0.15) : (opt.rate || 1.35);
      u.pitch = opt.g === 'm' ? (isMale(voice) ? 1 : 0.72) : (nat ? 1 : (opt.pitch || 1.05));
      u.onstart = function(){ started = true; };
      u.onend = u.onerror = function(){
        if (fin) return; fin = true; clearTimeout(wd);
        var spent = Date.now() - t0;
        if (!started || spent < line.length * 60){ useVoice = false; wd = setTimeout(next, Math.max(300, textTime(line) - spent)); }
        else wd = setTimeout(next, 120);
      };
      speechSynthesis.speak(u);
      wd = setTimeout(function(){
        if (fin) return;
        if (!started){ useVoice = false; try { speechSynthesis.cancel(); } catch(e){} fin = true; wd = setTimeout(next, Math.max(300, textTime(line) - 1600)); }
        else { wd = setTimeout(function(){ if (!fin){ fin = true; next(); } }, line.length * 260 + 1500); }
      }, 1600);
    } catch(e){ useVoice = false; wd = setTimeout(next, textTime(line)); }
  }
  next();
  return { stop:function(){ stopped = true; clearTimeout(wd); try { speechSynthesis.cancel(); } catch(e){} } };
}
function stopAll(){
  clearInterval(T.cd); T.cd = null; clearInterval(T.ring); T.ring = null; clearInterval(T.clock); T.clock = null; clearInterval(T.nudge); T.nudge = null;
  if (T.speech){ T.speech.stop(); T.speech = null; }
  try { speechSynthesis.cancel(); } catch(e){}
  vibrate(0);
}

/* ================================================================
   遊戲

var G = null;

function startGame(id){

  });

function buildPhone(){
  var S0 = G.sc, feeds = Object.keys(S0.threads).map(function(k){ return '<div class="feed" id="f-'+k+'" hidden aria-live="polite"></div>'; }).join('');

        '<span class="nm"><b id="hnm"></b><small id="hsub"></small></span></div>'+

function updateHud(){

}
function setThread(th){
  var S0 = G.sc, info = S0.threads[th];

  Object.keys(S0.threads).forEach(function(k){ var f = $('f-' + k); if (f) f.hidden = k !== th; });

  var b = document.querySelector('.banner'); if (b && b.getAttribute('data-th') === th) rm(b);

}
function updateUnread(){

  var b = $('bdot'); if (b){ b.hidden = !n; b.textContent = n ? String(n) : ''; }
}
function setClock(t, raw){ var v = raw ? t : addMin(t, G.offset); var c = $('clk'); if (c && v) c.textContent = v; G.time = v; }
function push(th, html, preview){
  var f = $('f-' + th); if (!f) return null;
  f.insertAdjacentHTML('beforeend', html);
  var el = f.lastElementChild;
  if (preview){ G.prev[th] = preview; G.prevT[th] = G.time; }
  if (th === G.active) f.scrollTop = f.scrollHeight;
  else if (preview){ G.unread[th] = (G.unread[th] || 0) + 1; updateUnread(); }
  return el;
}
function senderOf(th, it){
  var info = G.sc.threads[th];
  if (it && typeof it === 'object' && it.from) return { name:it.from, av:it.av || '💬', label:true };
  return { name:info.name, av:info.av, label:false };
}
function inHTML(th, text, it){

  return '<div class="m'+(cont ? ' cont' : '')+'"><span class="mav">'+avh(s0.av)+'</span><div class="mb">'+(s0.label && !cont ? '<span class="snd">'+esc(s0.name)+'</span>' : '')+
    '<div class="row"><div class="b">'+text+'</div><span class="tm">'+(G.time || '')+'</span></div></div></div>';
}
function outHTML(text){
  return '<div class="m out"><div class="mb"><div class="row"><div class="b">'+ph(text)+'</div><span class="tm">'+(G.time || '')+'</span></div><div class="read" hidden>已讀</div></div></div>';
}
function showBanner(th, text, sticky){
  var sc = $('feeds'); if (!sc) return;
  var info = G.sc.threads[th];
  rm(sc.querySelector('.banner')); clearTimeout(T.banner);
  sc.insertAdjacentHTML('beforeend', '<button class="banner'+(sticky ? ' sticky' : '')+'" data-act="openTh" data-th="'+th+'"><span class="av">'+avh(info.av)+'</span><span class="tx"><b>'+esc(info.name)+'</b><span>'+esc(text)+'</span></span><span class="open">點開</span></button>');
  if (!sticky){ var b = sc.querySelector('.banner'); T.banner = setTimeout(function(){ if (b && b.parentNode && !b.classList.contains('sticky')) rm(b); }, 2600); }

}
function typingOn(th, it){
  var s0 = senderOf(th, it);
  return push(th, '<div class="m tp'+(G.last[th] === s0.name ? ' cont' : '')+'"><span class="mav">'+avh(s0.av)+'</span><div class="mb"><div class="typing"><i></i><i></i><i></i></div></div></div>');
}
function previewOf(it, text){ return (it && typeof it === 'object' && it.from) ? it.from + '：' + text : text; }
function okWhen(it){
  if (!it || typeof it !== 'object' || !it.when) return true;
  var p = G.picks[it.when.r];
  if (!p || p.d !== it.when.d) return false;
  if (it.when.to !== undefined && !!p.to !== it.when.to) return false;
  return true;
}

/* 播放一則對方的訊息；不在目前視窗時，只跳通知＋紅點 */
async function playItem(it, tok, th){
  if (typeof it === 'object' && it.wait){ await wait(it.wait); return alive(tok); }
  var here = th === G.active;
  if (typeof it === 'object' && it.div){ setClock(it.div, true); push(th, '<div class="div">'+esc(it.div)+'</div>'); await wait(800); return alive(tok); }
  if (typeof it === 'object' && it.sys){ push(th, '<div class="sys">'+esc(it.sys)+'</div>'); await wait(900); return alive(tok); }
  if (typeof it === 'object' && it.typing){
    if (!here){ await wait(1800); return alive(tok); }
    var a = typingOn(th, it); await wait(1300); rm(a); if (!alive(tok)) return false;
    await wait(700); var b = typingOn(th, it); await wait(1100); rm(b); await wait(400); return alive(tok);
  }
  if (typeof it === 'object' && it.unsend){
    var t1 = here ? typingOn(th) : null; await wait(1000); rm(t1); if (!alive(tok)) return false;
    var el = push(th, inHTML(th, ph(it.unsend)), it.unsend); sndKey(); buzz();
    if (!here) showBanner(th, it.unsend, false);
    await wait(1600); if (!alive(tok)) return false;
    var bb = el && el.querySelector('.b'); if (bb){ bb.classList.add('unsent'); bb.textContent = G.sc.threads[th].name + ' 收回了一則訊息'; }
    var tm = el && el.querySelector('.tm'); if (tm) tm.textContent = '';
    G.prev[th] = '收回了一則訊息';
    await wait(1100); return alive(tok);
  }
  if (typeof it === 'object' && it.voice){
    var t2 = here ? typingOn(th) : null; await wait(1500); rm(t2); if (!alive(tok)) return false;
    var k = G.voices.length; G.voices.push(it.voice.text);
    push(th, inHTML(th, '<div class="voice" id="vc'+k+'"><button class="play" data-act="voice" data-k="'+k+'" aria-label="播放語音訊息"><svg viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></svg></button><span class="wave">'+waveBars()+'</span><span class="d">'+it.voice.d+'</span></div><div class="vhint" id="vh'+k+'">點一下播放</div><div class="vtext" id="vt'+k+'" hidden></div>'), '🎤 語音訊息');
    sndKey(); buzz(); if (!here) showBanner(th, '傳來一則語音訊息', false);
    await wait(1700); return alive(tok);
  }
  var text = itemText(it), pv = previewOf(it, text);
  var t3 = here ? typingOn(th, it) : null;
  await wait(Math.min(1700, Math.max(650, 420 + text.length * 32))); rm(t3); if (!alive(tok)) return false;
  push(th, inHTML(th, ph(text), it), pv); sndKey(); buzz();
  if (!here) showBanner(th, pv, false);
  await wait(Math.min(1500, 600 + text.length * 16));
  return alive(tok);
}

/* ---------------- 回合 ---------------- */
async function runRound(i){
  var tok = G.tok; if (!alive(tok)) return;
  G.r = i; updateHud();
  var R = G.sc.rounds[i];
  setClock(R.t);
  var items = (R.items || []).filter(okWhen);
  for (var k = 0; k < items.length; k++){ if (!(await playItem(items[k], tok, R.th))) return; }
  if (!alive(tok)) return;
  if (R.call) return runCall(R, tok);
  beginChoice(R, tok);
}
function beginChoice(R, tok){
  G.choice = { R:R, tok:tok, order:shuffle([0, 1, 2]), started:false };
  if (R.th !== G.active){
    /* 另一個視窗：只跳通知＋紅點，點開才開始倒數；沒點的話每隔一陣子再震一次 */
    showBanner(R.th, G.prev[R.th] || '傳來新訊息', true);
    clearInterval(T.nudge);
    T.nudge = setInterval(function(){
      if (!alive(tok) || !G.choice || G.choice.started){ clearInterval(T.nudge); T.nudge = null; return; }
      if (G.paused || G.active === R.th) return;
      showBanner(R.th, G.prev[R.th] || '傳來新訊息', true);
    }, 8000);
  }
  renderChoice();
}
function startChoiceTimer(){
  var c = G.choice; if (!c || c.started) return;
  c.started = true; clearInterval(T.nudge); T.nudge = null;
  $('tmr').hidden = false;
  startTimer(CFG.reply, { bar:'tbi', num:'tnum', wrap:'tmr' }, function(){ chase(c.R, c.tok); }, function(){ onTimeout(c.tok); });
}
function renderChoice(){
  var box = $('opts'); if (!box) return;
  var c = G.choice;
  if (!c){ box.hidden = true; box.innerHTML = ''; return; }
  var R = c.R;
  if (G.active === R.th){
    box.innerHTML = c.order.map(function(k){ return '<button class="opt" data-act="pick" data-k="'+k+'">'+ph(R.opts[k].t)+'</button>'; }).join('');
    box.hidden = false;
    startChoiceTimer();
  } else {
    var info = G.sc.threads[R.th], n = G.unread[R.th] || 0;
    box.innerHTML = '<button class="waitbar" data-act="openTh" data-th="'+R.th+'"><span class="av">'+avh(info.av)+'</span><span class="wt"><b>'+esc(info.name)+'</b> 傳來'+(n ? ' ' + n + ' 則' : '')+'新訊息</span><span class="open">點開回覆</span></button>';
    box.hidden = false;
  }
  var f = $('f-' + G.active); if (f) f.scrollTop = f.scrollHeight;
}
function startTimer(sec, ids, onChase, onEnd){
  var total = sec * 1000, left = total, chased = false;
  clearInterval(T.cd);
  T.cd = setInterval(function(){
    if (document.hidden || (G && G.paused)) return;
    left -= 100;
    var bar = $(ids.bar), num = $(ids.num), w = $(ids.wrap);
    if (bar) bar.style.transform = 'scaleX(' + Math.max(0, left / total) + ')';
    if (num) num.textContent = Math.max(0, Math.ceil(left / 1000));
    if (w) w.classList.toggle('hot', left <= 5000);
    if (!chased && left <= CFG.chase * 1000){ chased = true; if (onChase) onChase(); }
    if (left <= 0){ clearInterval(T.cd); T.cd = null; onEnd(); }
  }, 100);
}
function stopTimer(){
  clearInterval(T.cd); T.cd = null;
  var tm = $('tmr'); if (tm){ tm.hidden = true; tm.classList.remove('hot'); }
  var bar = $('tbi'); if (bar) bar.style.transform = 'scaleX(1)';
  var num = $('tnum'); if (num) num.textContent = CFG.reply;
}
async function chase(R, tok){
  if (!R.chase || !alive(tok) || !G.choice) return;
  var th = R.th;
  if (typeof R.chase === 'object' && R.chase.typing){
    if (th === G.active){ var a = typingOn(th); await wait(2600); rm(a); }
    else showBanner(th, '正在輸入…', true);
    return;
  }
  var ct = itemText(R.chase), pv = previewOf(R.chase, ct);
  push(th, inHTML(th, ph(ct), R.chase), pv); sndKey(); buzz(); vibrate(80);
  if (th !== G.active){ showBanner(th, pv, true); renderChoice(); }
}
function record(d, text, extra){
  var rec = { d:d, t:text }; if (extra) for (var k in extra) rec[k] = extra[k];
  G.picks[G.r] = rec; G.counts[d]++;
}
async function typeOut(text, tok){
  var box = $('inbox'), send = $('sendBtn'); if (!box) return;
  var per = Math.max(9, Math.min(30, 1300 / text.length)), shown = '';
  send.classList.add('on');
  for (var i = 0; i < text.length; i++){
    shown += text[i];
    if (i % 2 === 0 || i === text.length - 1){ box.innerHTML = esc(shown) + '<span class="caret"></span>'; box.scrollTop = box.scrollHeight; await wait(per * 2); if (!alive(tok)) return; }
  }
  await wait(260);
  box.innerHTML = '<span class="ph">輸入訊息</span>'; send.classList.remove('on'); sndSend();
}
async function pick(k){
  var c = G.choice; if (!c || G.active !== c.R.th) return;
  G.choice = null; stopTimer(); renderChoice();
  var tok = c.tok, R = c.R, o = R.opts[k], th = R.th;
  clearInterval(T.nudge); T.nudge = null; rm(document.querySelector('.banner.sticky'));
  record(o.d, o.t);
  await typeOut(o.t, tok); if (!alive(tok)) return;
  var el = push(th, outHTML(o.t)); G.last[th] = 'me'; G.lastReply = o.t; G.prev[th] = o.t; G.prevT[th] = G.time;
  setTimeout(function(){ var r = el && el.querySelector('.read'); if (r) r.hidden = false; }, 900);
  await wait(1100); if (!alive(tok)) return;
  for (var i = 0; i < o.re.length; i++){ if (!(await playItem(o.re[i], tok, th))) return; }
  await wait(1000); if (!alive(tok)) return;
  nextRound();
}
async function onTimeout(tok){
  var c = G.choice; if (!c || !alive(tok)) return;
  G.choice = null; stopTimer(); renderChoice();
  var R = c.R, th = R.th;
  record('s', '（已讀不回）', { to:true });
  rm(document.querySelector('.banner.sticky'));
  push(G.active, '<div class="sys">'+CFG.reply+' 秒過去了，你沒有回覆'+(th !== G.active ? G.sc.threads[th].name : '')+'</div>');
  await wait(1000); if (!alive(tok)) return;
  for (var i = 0; i < R.timeout.length; i++){ if (!(await playItem(R.timeout[i], tok, th))) return; }
  await wait(1000); if (!alive(tok)) return;
  nextRound();
}
function nextRound(){
  if (!G) return;
  if (G.r + 1 >= G.sc.rounds.length) finish(G.tok);
  else runRound(G.r + 1);
}

/* ---------------- 來電（算一回合） ---------------- */
function runCall(R, tok){
  var c = R.call, sc = $('screen');
  G.call = { R:R, c:c, tok:tok, state:'ring', sec:0, jump:0 };
  rm(sc.querySelector('.banner')); var cl = $('clist'); if (cl) cl.hidden = true;
  sc.insertAdjacentHTML('beforeend', '<div class="callov ringing" id="callov"><div class="cst" id="cst">來電</div>'+
    '<div class="cav">'+avh(c.av)+'</div><div class="cnm">'+esc(c.from)+'</div><div class="csub">行動電話</div>'+
    '<div class="hint">'+ico('speaker')+'有語音也有字幕，沒開聲音也沒關係</div>'+
    '<div class="ringleft" id="ringleft"></div>'+
    '<div class="cap" id="cap"></div><div class="cbox" id="cbox"></div>'+
    '<div class="cbtns one" id="cbtns"><button class="cbtn yes" data-act="callYes"><i>'+ico('phone')+'</i>接聽</button></div></div>');
  sndRing(); vibrate([500, 300, 500, 300, 500]);
  T.ring = setInterval(function(){ if (!G || G.paused) return; sndRing(); vibrate([500, 300, 500]); }, 1500);
  /* 電話一定要接：響越久，提示越明顯 */
  var t = 0, NUDGE = [[4000, '電話一直響個不停……'], [8000, '看來不接是不行了，點「接聽」吧'], [14000, '它還在響。']];
  clearInterval(T.cd);
  T.cd = setInterval(function(){
    if (document.hidden || (G && G.paused)) return;
    t += 100;
    NUDGE.forEach(function(n){ if (t === n[0]){ var rl = $('ringleft'); if (rl){ rl.textContent = n[1]; rl.classList.add('on'); } var ov = $('callov'); if (ov) ov.classList.add('nudge'); } });
  }, 100);
}
function capLine(text, me){
  var cap = $('cap'); if (!cap) return;
  Array.prototype.forEach.call(cap.children, function(p){ p.classList.add('old'); });
  while (cap.children.length > 2) cap.removeChild(cap.firstChild);
  cap.insertAdjacentHTML('beforeend', '<p'+(me ? ' class="me"' : '')+'>'+ph(text)+'</p>');
}
function fmtSec(s){ return ('0' + Math.floor(s / 60)).slice(-2) + ':' + ('0' + s % 60).slice(-2); }
function callTalk(){
  var C = G.call; if (!C) return;
  clearInterval(T.cd); T.cd = null; clearInterval(T.ring); T.ring = null; vibrate(0);
  C.state = 'talk';
  $('callov').classList.remove('ringing');
  rm($('ringleft')); $('cbtns').innerHTML = '';
  $('cst').innerHTML = '通話中 <b>00:00</b>';
  T.clock = setInterval(function(){ C.sec++; var e = $('cst'); if (e && C.state !== 'end') e.innerHTML = '通話中 <b>'+fmtSec(C.sec)+'</b>'; }, 1000);
  T.speech = speakLines(C.c.p1.filter(okWhen).map(function(l){ return typeof l === 'string' ? l : l.text; }), C.c.voice, function(line){ capLine(line); }, function(){ callAsk(); });
}
function callAsk(){
  var C = G.call; if (!C || !alive(C.tok)) return;
  C.state = 'ask'; C.order = shuffle([0, 1, 2]);
  $('cbox').innerHTML = '<div class="tmr" id="ctmr"><span class="lb">插話</span><span class="tb"><i id="ctbi"></i></span><b id="ctnum">'+CFG.reply+'</b></div>'+
    C.order.map(function(k){ return '<button class="copt" data-act="cpick" data-k="'+k+'">'+ph(C.c.opts[k].t)+'</button>'; }).join('');
  startTimer(CFG.reply, { bar:'ctbi', num:'ctnum', wrap:'ctmr' }, null, function(){ callAnswer(-1); });
}
async function callAnswer(k){
  var C = G.call; if (!C || C.state !== 'ask') return;
  C.state = 'reply'; clearInterval(T.cd); T.cd = null;
  var tok = C.tok, p2;
  $('cbox').innerHTML = '';
  if (k < 0){ record('s', '（電話裡沒說話）', { to:true, call:true }); capLine('（你沒有說話）', true); p2 = C.c.to; }
  else {
    var o = C.c.opts[k]; record(o.d, o.t, { call:true });
    capLine('你：' + o.t, true); G.lastReply = o.t; p2 = o.p2;
    if (o.dur) C.jump = o.dur;
  }
  await wait(900); if (!alive(tok)) return;
  T.speech = speakLines(p2, C.c.voice, function(line){
    capLine(line);
    if (C.jump && /^（.+後）/.test(line)){ C.sec = C.jump * 60 + 12; var e = $('cst'); if (e) e.innerHTML = '通話中 <b>'+fmtSec(C.sec)+'</b>'; }
  }, function(){ callEnd(false); });
}
function callEnd(missed){
  var C = G.call; if (!C) return;
  var tok = C.tok, R = C.R; C.state = 'end';
  clearInterval(T.clock); T.clock = null; clearInterval(T.cd); T.cd = null; clearInterval(T.ring); T.ring = null;
  if (T.speech){ T.speech.stop(); T.speech = null; }
  var cst = $('cst'); if (cst) cst.textContent = missed ? (missed === 'rej' ? '已拒接' : '未接來電') : '對方已掛斷';
  var cb = $('cbtns'); if (cb) cb.innerHTML = ''; rm($('ringleft'));
  var ov = $('callov'); if (ov) ov.classList.remove('ringing');
  if (!missed) sndHang();
  setTimeout(function(){
    if (!alive(tok)) return;
    if (ov) ov.classList.add('bye');
    setTimeout(async function(){
      rm(ov); if (!alive(tok)) return;
      G.call = null;
      if (G.active !== R.th) setThread(R.th);
      if (C.jump){ G.offset += C.jump; setClock(R.t); }
      if (missed) push(R.th, '<div class="call-log miss">'+ico('missed')+(missed === 'rej' ? '已拒接・' : '未接來電・')+esc(C.c.from)+'</div>', '📞 未接來電');
      else push(R.th, '<div class="call-log">'+ico('phone')+'語音通話・'+fmtSec(C.sec)+'</div>', '📞 語音通話');
      G.last[R.th] = null;
      await wait(700); if (!alive(tok)) return;
      if (missed){
        var missItems = C.c.miss.filter(okWhen);
        for (var i = 0; i < missItems.length; i++){
          var it = missItems[i];
          if (typeof it === 'object'){ if (!(await playItem(it, tok, R.th))) return; continue; }
          var a = typingOn(R.th); await wait(560); rm(a); if (!alive(tok)) return;
          push(R.th, inHTML(R.th, ph(it)), it); sndKey(); buzz(); vibrate(90);
          await wait(620); if (!alive(tok)) return;
        }
        await wait(800); if (!alive(tok)) return;
      }
      nextRound();
    }, 450);
  }, missed ? 700 : 1000);
}
function callMiss(rejected){
  var C = G.call; if (!C || C.state !== 'ring') return;
  clearInterval(T.cd); T.cd = null; clearInterval(T.ring); T.ring = null; vibrate(0);
  record('s', rejected ? '（拒接電話）' : '（沒接電話）', { to:!rejected, call:true });
  callEnd(rejected ? 'rej' : 'miss');
}

/* ---------------- 結局 ---------------- */
function endKey(c){
  if (c.o === 2 && c.s === 2 && c.p === 2) return 'h';
  var arr = [['o', c.o], ['s', c.s], ['p', c.p]].sort(function(a, b){ return b[1] - a[1]; });
  if (arr[0][1] - arr[1][1] <= 1) return [arr[0][0], arr[1][0]].sort(function(a, b){ return 'osp'.indexOf(a) - 'osp'.indexOf(b); }).join('');
  return arr[0][0];
}
async function finish(tok){
  if (!alive(tok)) return;
  var S0 = G.sc, key = endKey(G.counts), E = S0.endings[key];
  G.ending = key; G.done = true; updateHud();
  LAST[G.id] = { picks:G.picks.slice(), counts:{ o:G.counts.o, s:G.counts.s, p:G.counts.p }, ending:key };
  stopTimer(); renderChoice();
  await wait(900); if (!alive(tok)) return;
  if (E.items && E.items.length){
    var eth = (typeof E.items[0] === 'object' && E.items[0].th) || 'main';
    if (G.active !== eth) setThread(eth);
    for (var i = 0; i < E.items.length; i++){ var it = E.items[i]; if (!(await playItem(it, tok, (typeof it === 'object' && it.th) || 'main'))) return; }
  }
  await wait(1600); if (!alive(tok)) return;
  showEnd();
}
function showEnd(){
  var S0 = G.sc, E = S0.endings[G.ending], c = G.counts;
  var rows = ['o','s','p'].map(function(d){ return '<div class="trow '+d+'"><span>'+DIR[d]+'</span><span class="bar"><i style="width:'+(c[d] / 6 * 100)+'%"></i></span><em>'+c[d]+'</em></div>'; }).join('');
  document.body.insertAdjacentHTML('beforeend', '<div class="endov" id="endov" role="dialog" aria-label="結局"><div class="endcard">'+
    (E.hidden ? '<span class="ek hid">隱藏結局・三向平衡</span>' : '<span class="ek">'+S0.role+'・'+S0.title+'</span>')+
    '<h2>'+esc(E.n)+'</h2><p class="epi">'+pp(E.t)+'</p>'+
    '<div class="tend"><h4>你這 6 回合的選擇</h4>'+rows+'</div>'+
    '<div class="end-acts"><button class="btn btn-pri" data-act="tplEnd">看八面玲瓏範本'+ico('arrow')+'</button>'+
      '<div class="row2"><button class="btn btn-sec" data-act="card">產生結局圖卡</button><button class="btn btn-sec" data-act="again">再玩一次</button></div>'+
      '<button class="btn-text" data-act="leave">換一個人</button></div></div></div>');
}

/* ---------------- 結局圖卡 ---------------- */
function wrapText(ctx, text, maxW){
  var lines = [], line = '';
  for (var i = 0; i < text.length; i++){
    var test = line + text[i];
    if (ctx.measureText(test).width > maxW && line && '，。、！？」』）…：；'.indexOf(text[i]) < 0){ lines.push(line); line = text[i]; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function rrect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function loadImg(svg){
  return new Promise(function(res){
    if (!svg) return res(null);
    var im = new Image(); im.onload = function(){ res(im); }; im.onerror = function(){ res(null); };
    im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    setTimeout(function(){ res(null); }, 1500);
  });
}
async function makeCard(){
  var S0 = G.sc, E = S0.endings[G.ending], c = G.counts;
  try {
    await Promise.race([Promise.all([
      document.fonts.load('700 80px "LXGW WenKai TC"'), document.fonts.load('400 40px "Noto Sans TC"'),
      document.fonts.load('700 40px "Noto Sans TC"'), document.fonts.load('500 30px "DM Mono"')]), wait(2500)]);
  } catch(e){}
  var W = 1080, H = 1920, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  var x = cv.getContext('2d');
  var disp = '"LXGW WenKai TC","Kaiti TC",serif', sans = '"Noto Sans TC","PingFang TC",sans-serif', mono = '"DM Mono",monospace';
  x.fillStyle = '#f7eee2'; x.fillRect(0, 0, W, H);
  var g = x.createRadialGradient(200, 60, 40, 200, 60, 900); g.addColorStop(0, 'rgba(255,184,104,.75)'); g.addColorStop(1, 'rgba(255,184,104,0)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.textBaseline = 'alphabetic';
  x.fillStyle = '#c96d18'; x.font = '500 30px ' + mono; x.fillText('引路人・教師職場情境遊戲', 90, 150);
  x.fillStyle = '#4a3326'; x.font = '700 100px ' + disp; x.fillText('老師，在嗎？', 84, 268);
  x.fillStyle = '#7a5d49'; x.font = '400 38px ' + sans; x.fillText(S0.role + '｜' + S0.title, 90, 336);
  /* 對話片段（高度依內容） */
  var py = 396;
  x.font = '400 38px ' + sans;
  var q = wrapText(x, S0.cardQuote, 620), qh = q.length * 56 + 44, qy = py + 104;
  var reply = (G.lastReply || '（已讀不回）');
  if (reply.length > 54) reply = reply.slice(0, 52) + '……';
  var r = wrapText(x, reply, 600).slice(0, 3), rh = r.length * 56 + 44, ry = qy + qh + 36;
  var pb = ry + rh + 48;
  rrect(x, 70, py, 940, pb - py, 48); x.fillStyle = '#f0e1cd'; x.fill();
  x.fillStyle = '#a88d77'; x.font = '500 28px ' + mono; x.fillText(S0.rounds[0].t + '　' + S0.name, 120, py + 66);
  var avImg = await loadImg(avSvgString(S0.av));
  if (avImg){ try { x.save(); x.beginPath(); x.arc(144, qy + 38, 38, 0, Math.PI * 2); x.clip(); x.drawImage(avImg, 106, qy, 76, 76); x.restore(); } catch(e){} }
  else { x.font = '60px ' + sans; x.fillText(S0.av, 108, qy + 62); }
  rrect(x, 196, qy, 690, qh, 36); x.fillStyle = '#fffaf3'; x.fill();
  x.fillStyle = '#4a3326'; x.font = '400 38px ' + sans; q.forEach(function(l, i){ x.fillText(l, 228, qy + 64 + i * 56); });
  var rw = Math.min(680, Math.max.apply(null, r.map(function(l){ return x.measureText(l).width; })) + 64);
  rrect(x, 970 - rw, ry, rw, rh, 36); x.fillStyle = '#ffdcb0'; x.fill();
  x.fillStyle = '#4a3326'; r.forEach(function(l, i){ x.fillText(l, 970 - rw + 32, ry + 64 + i * 56); });
  /* 結局 */
  var ey = pb + 110;
  x.fillStyle = '#c96d18'; x.font = '700 32px ' + sans; x.fillText(E.hidden ? '隱藏結局・三向平衡' : '我的結局', 90, ey);
  x.fillStyle = '#4a3326'; x.font = '700 90px ' + disp;
  var nl = wrapText(x, E.n, 900); nl.forEach(function(l, i){ x.fillText(l, 86, ey + 104 + i * 104); });
  var ty = ey + 104 + (nl.length - 1) * 104 + 78;
  x.fillStyle = '#7a5d49'; x.font = '400 36px ' + sans;
  var el = wrapText(x, E.t, 900), maxL = Math.max(3, Math.floor((1560 - ty) / 58));
  if (el.length > maxL){ el = el.slice(0, maxL); el[maxL - 1] = el[maxL - 1].slice(0, -1) + '…'; }
  el.forEach(function(l, i){ x.fillText(l, 90, ty + i * 58); });
  /* 傾向 */
  var by = ty + el.length * 58 + 34, cols = { o:'#c8604f', s:'#5f8a55', p:'#4f72a0' };
  ['o','s','p'].forEach(function(d, i){
    var bx = 90 + i * 306;
    rrect(x, bx, by, 282, 74, 37); x.fillStyle = '#fffaf3'; x.fill();
    x.fillStyle = cols[d]; x.beginPath(); x.arc(bx + 40, by + 37, 10, 0, Math.PI * 2); x.fill();
    x.font = '700 32px ' + sans; x.fillText(DIR[d], bx + 62, by + 49);
    x.fillStyle = '#4a3326'; x.font = '500 36px ' + mono; x.textAlign = 'right'; x.fillText(String(c[d]), bx + 252, by + 50); x.textAlign = 'left';
  });
  /* 頁尾 */
  x.strokeStyle = '#e2cdb3'; x.lineWidth = 2; x.beginPath(); x.moveTo(90, 1730); x.lineTo(990, 1730); x.stroke();
  x.fillStyle = '#4a3326'; x.font = '700 40px ' + sans; x.fillText('你會怎麼回？', 90, 1806);
  x.fillStyle = '#c96d18'; x.font = '500 34px ' + mono; x.textAlign = 'right'; x.fillText(IG_HANDLE, 990, 1806); x.textAlign = 'left';
  x.fillStyle = '#a88d77'; x.font = '400 28px ' + sans; x.fillText('引路人', 90, 1856);
  return cv.toDataURL('image/png');
}
async function showCard(){
  toast('圖卡產生中…');
  var url = await makeCard();
  $('toast').classList.remove('on');
  document.body.insertAdjacentHTML('beforeend', '<div class="cardov" id="cardov"><img src="'+url+'" alt="結局圖卡"><p>長按（或按右鍵）圖片就能儲存，分享到 IG 限動。</p>'+
    '<div class="row2"><button class="btn btn-sec" data-act="closeCard">關閉</button><a class="btn btn-pri" href="'+url+'" download="老師在嗎-結局.png">下載圖片</a></div></div>');
}

/* ---------------- 離開 ---------------- */
function leaveGame(){
  if (G) G.tok++;
  stopAll();
  try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function(){}); } catch(e){}
  document.body.classList.remove('playing');
  rm($('endov')); rm($('modal')); rm($('cardov'));
  $('stage').innerHTML = '';
  G = null;
}
function confirmExit(){
  if (!G) return;
  G.paused = true;
  document.body.insertAdjacentHTML('beforeend', '<div class="modal" id="modal" role="dialog" aria-label="要離開這段對話嗎"><div class="box"><h3>要離開這段對話嗎？</h3>'+
    '<p>離開後，這次的回合不會保留。對方……應該還會繼續傳。</p>'+
    '<div class="row2"><button class="btn btn-sec" data-act="exitYes">離開</button><button class="btn btn-pri" data-act="exitNo">繼續回訊息</button></div></div></div>');
}
function openList(){
  if (!G) return;
  var cl = $('clist'); if (!cl) return;
  if (!cl.hidden){ cl.hidden = true; return; }
  var S0 = G.sc;
  var rows = Object.keys(S0.threads).filter(function(k){ return G.prev[k] || k === G.active; }).map(function(k){
    var info = S0.threads[k], n = k === G.active ? 0 : (G.unread[k] || 0);
    return '<button class="crow" data-act="openTh" data-th="'+k+'"><span class="av">'+avh(info.av)+'</span><span class="tx"><b>'+esc(info.name)+'</b><span>'+esc(G.prev[k] || '')+'</span></span><span class="rt">'+(G.prevT[k] || '')+(n ? '<i>'+n+'</i>' : '')+'</span></button>';
  }).join('');
  cl.innerHTML = '<div class="ch"><b>聊天</b><button class="hbtn icon x" data-act="back" aria-label="關閉" style="background:var(--cream2);color:var(--ink);border-color:var(--line)">'+ico('x')+'</button></div>'+rows;
  cl.hidden = false;
}

/* ================================================================
   事件
   ================================================================ */
document.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), k = +b.getAttribute('data-k');
  if (b.classList.contains('btn')){ b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
  switch (act){
    case 'top': window.scrollTo({ top:0, behavior:'smooth' }); break;
    case 'home': showHome(); break;
    case 'pickView': showPick(); break;
    case 'tpage': tplGo(+b.getAttribute('data-p')); break;
    case 'closeModal': rm($('modal')); break;
    case 'play': if (!SCEN[b.getAttribute('data-id')].wip) startGame(b.getAttribute('data-id')); break;
    case 'tpl': showTpl(b.getAttribute('data-id'), 0); break;
    case 'bgGo': if (!G || $('phone')) return; buildPhone(); runRound(0); break;
    case 'pick': pick(k); break;
    case 'openTh': if (G && G.sc.threads[b.getAttribute('data-th')]){ setThread(b.getAttribute('data-th')); } break;
    case 'back': openList(); break;
    case 'callYes': if (G && G.call && G.call.state === 'ring'){ audioUnlock(); callTalk(); } break;
    
    case 'cpick': callAnswer(k); break;
    case 'voice':
      var text = G && G.voices[k]; if (!text) return;
      var vc = $('vc' + k), vt = $('vt' + k); rm($('vh' + k));
      if (vc) vc.classList.add('playing'); if (vt){ vt.hidden = false; vt.textContent = ''; }
      if (T.speech) T.speech.stop();
      audioUnlock();
      T.speech = speakLines(splitSentences(text), { rate:1.35, pitch:1.05 }, function(line){ if (vt) vt.textContent += line; var f = $('f-' + G.active); if (f) f.scrollTop = f.scrollHeight; }, function(){ if (vc) vc.classList.remove('playing'); });
      break;
    case 'snd':
      AUDIO.on = !AUDIO.on; if (AUDIO.on) audioUnlock(); else { try { speechSynthesis.cancel(); } catch(e){} }
      b.innerHTML = ico(AUDIO.on ? 'speaker' : 'mute'); toast(AUDIO.on ? '聲音已開啟' : '已改成只看字幕'); break;
    case 'exit': confirmExit(); break;
    case 'exitNo': rm($('modal')); if (G) G.paused = false; break;
    case 'exitYes': leaveGame(); showPick(); break;
    case 'card': if (G && G.ending) showCard(); break;
    case 'closeCard': rm($('cardov')); break;
    case 'again': if (G) startGame(G.id); break;
    case 'tplEnd': if (G){ var id = G.id; leaveGame(); showTpl(id, 0); } break;
    case 'leave': leaveGame(); showPick(); break;
  }
});
document.addEventListener('keydown', function(ev){
  if (VIEW.name === 'tpl' && !G && !$('modal')){
    if (ev.key === 'ArrowRight'){ tplGo(VIEW.page + 1); return; }
    if (ev.key === 'ArrowLeft'){ tplGo(VIEW.page - 1); return; }
  }
  if (ev.key === 'Escape'){
    if ($('modal')){ var no = document.querySelector('[data-act="exitNo"],[data-act="closeModal"]'); if (no) no.click(); }
    else if ($('cardov')) rm($('cardov'));
  }
});
try { if (window.speechSynthesis){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = function(){ speechSynthesis.getVoices(); }; } } catch(e){}
/* 範本頁：左右滑動換頁 */
(function(){
  var sx = 0, sy = 0, on = false;
  document.addEventListener('touchstart', function(e){ if (VIEW.name !== 'tpl' || G || e.touches.length !== 1) return; on = true; sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive:true });
  document.addEventListener('touchend', function(e){
    if (!on) return; on = false;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 50) tplGo(VIEW.page + (dx < 0 ? 1 : -1));
  }, { passive:true });
})();
showHome();

</script>
